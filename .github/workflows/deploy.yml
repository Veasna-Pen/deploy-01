name: Deploy Node.js App to DigitalOcean

on:
  push:
    branches:
      - main # Trigger on pushes to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build TypeScript project
        run: npm run build

      # Step 1: Upload the built files to the server
      - name: Upload built files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist/*" # Upload only built files
          target: "/root/deploy-01/dist" # Path on server where your app lives

      # Step 2: Upload package.json and package-lock.json for production dependencies
      - name: Upload package files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "package*.json"
          target: "/root/deploy-01"

      # Step 3: Install production dependencies and restart PM2
      - name: Install production dependencies & restart PM2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/deploy-01
            npm install --production
            pm2 restart deploy-01
            pm2 save
